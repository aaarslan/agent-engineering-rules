name: validate

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: validate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  release-linux:
    name: release-linux
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        node: ['24.0.0', '24.x']
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - name: Diagnose filesystem metadata on the claimed runtime
        run: node tools/probe-filesystem.mjs
      - name: Validate final package, lifecycle, research and preserved regressions
        run: npm run release:check

  release-windows:
    name: release-windows
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      matrix:
        node: ['24.0.0', '24.x']
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - name: Diagnose filesystem metadata on the claimed runtime
        run: node tools/probe-filesystem.mjs
      - name: Validate final package, lifecycle, research and preserved regressions
        run: npm run release:check

  research-preflight:
    name: research-preflight
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Validate corpus, frozen history, and instruction loads without providers
        run: npm run validate:research
