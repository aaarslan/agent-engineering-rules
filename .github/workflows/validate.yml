name: validate

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: validate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  release-linux:
    name: release-linux
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Test release validators
        run: node --test tools/build-distributions.test.mjs tools/validate-source.test.mjs tools/validate-public-content.test.mjs tools/aer.test.mjs tools/install-distribution.test.mjs tools/tool-contracts.test.mjs tools/guidance-regressions.test.mjs
      - name: Smoke-test packed global install
        run: npm run test:packed
      - name: Reject personal filesystem paths
        run: node tools/validate-public-content.mjs
      - name: Validate source corpus
        run: node tools/validate-source.mjs
      - name: Validate distributions match source
        run: node tools/validate-distributions.mjs

  release-windows:
    name: release-windows
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Test release validators
        run: node --test tools/build-distributions.test.mjs tools/validate-source.test.mjs tools/validate-public-content.test.mjs tools/aer.test.mjs tools/install-distribution.test.mjs tools/tool-contracts.test.mjs tools/guidance-regressions.test.mjs
      - name: Smoke-test packed global install
        run: npm run test:packed
      - name: Reject personal filesystem paths
        run: node tools/validate-public-content.mjs
      - name: Validate source corpus
        run: node tools/validate-source.mjs
      - name: Validate distributions match source
        run: node tools/validate-distributions.mjs

  research-preflight:
    name: research-preflight
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Test research harnesses
        run: node --test tools/preflight-evals.test.mjs tools/live-ab-eval.test.mjs
      - name: Validate frozen evaluation inputs
        run: node tools/preflight-evals.mjs
      - name: Validate runtime load plans
        run: node tools/validate-runtime-loads.mjs --json
