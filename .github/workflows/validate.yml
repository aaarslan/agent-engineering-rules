name: validate

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: validate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  release-linux:
    name: release-linux
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Test release validators
        run: npm test
      - name: Smoke-test packed global install
        run: npm run test:packed
      - name: Reject personal filesystem paths
        run: node tools/validate-public-content.mjs
      - name: Validate source corpus
        run: node tools/validate-source.mjs
      - name: Validate distributions match source
        run: node tools/validate-distributions.mjs

  release-windows:
    name: release-windows
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Test release validators
        run: npm test
      - name: Smoke-test packed global install
        run: npm run test:packed
      - name: Reject personal filesystem paths
        run: node tools/validate-public-content.mjs
      - name: Validate source corpus
        run: node tools/validate-source.mjs
      - name: Validate distributions match source
        run: node tools/validate-distributions.mjs

  research-preflight:
    name: research-preflight
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Test research harnesses
        run: node --test tools/preflight-evals.test.mjs tools/live-ab-eval.test.mjs
      - name: Validate frozen evaluation inputs
        run: node tools/preflight-evals.mjs
      - name: Validate runtime load plans
        run: node tools/validate-runtime-loads.mjs --json
