name: validate

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: validate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  release-linux-runtimes:
    name: release-linux-runtime
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: ['24.11.1', '24.x']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - name: Diagnose filesystem metadata on the claimed runtime
        run: node tools/probe-filesystem.mjs
      - name: Validate final package, lifecycle, research and preserved regressions
        run: npm run release:check

  release-windows-runtimes:
    name: release-windows-runtime
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: ['24.11.1', '24.x']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - name: Diagnose filesystem metadata on the claimed runtime
        run: node tools/probe-filesystem.mjs
      - name: Validate final package, lifecycle, research and preserved regressions
        run: npm run release:check

  release-linux:
    name: release-linux
    needs: release-linux-runtimes
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every Linux runtime cell
        env:
          RESULT: ${{ needs.release-linux-runtimes.result }}
        run: test "$RESULT" = success

  release-windows:
    name: release-windows
    needs: release-windows-runtimes
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every Windows runtime cell
        env:
          RESULT: ${{ needs.release-windows-runtimes.result }}
        run: test "$RESULT" = success

  research-preflight:
    name: research-preflight
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Validate corpus, frozen history, and instruction loads without providers
        run: npm run validate:research
